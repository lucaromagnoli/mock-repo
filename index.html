<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .calculator {
      background: #222;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      width: 280px;
    }

    /* Display */
    .display {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .display .expression {
      font-size: 14px;
      color: #888;
      min-height: 18px;
      word-break: break-all;
    }

    .display .result {
      font-size: 32px;
      color: #fff;
      font-weight: bold;
      word-break: break-all;
    }

    /* Button grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 18px 0;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover  { background: #444; }
    button:active { background: #555; }

    /* Clear — spans full width of first row */
    button.btn-clear {
      grid-column: span 2;
      background: #c0392b;
    }
    button.btn-clear:hover  { background: #e74c3c; }

    /* Operator buttons */
    button.btn-op {
      background: #e67e22;
    }
    button.btn-op:hover  { background: #f39c12; }

    /* Equals button */
    button.btn-equals {
      background: #27ae60;
    }
    button.btn-equals:hover  { background: #2ecc71; }

    /* Zero spans two columns */
    button.btn-zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn-clear" onclick="handleClear()">C</button>
      <button class="btn-op"    onclick="handleOperator('÷')">÷</button>
      <button class="btn-op"    onclick="handleOperator('×')">×</button>

      <!-- Row 2 -->
      <button onclick="handleDigit('7')">7</button>
      <button onclick="handleDigit('8')">8</button>
      <button onclick="handleDigit('9')">9</button>
      <button class="btn-op" onclick="handleOperator('-')">−</button>

      <!-- Row 3 -->
      <button onclick="handleDigit('4')">4</button>
      <button onclick="handleDigit('5')">5</button>
      <button onclick="handleDigit('6')">6</button>
      <button class="btn-op" onclick="handleOperator('+')">+</button>

      <!-- Row 4 -->
      <button onclick="handleDigit('1')">1</button>
      <button onclick="handleDigit('2')">2</button>
      <button onclick="handleDigit('3')">3</button>
      <button class="btn-equals" onclick="handleEquals()">=</button>

      <!-- Row 5 -->
      <button class="btn-zero" onclick="handleDigit('0')">0</button>
      <button onclick="handleDigit('.')">.</button>
      <!-- equals already placed -->
    </div>
  </div>

  <script>
    // ── State ────────────────────────────────────────────────────────────────
    let currentInput      = '';   // digits being typed
    let operator          = null; // pending operator
    let previousValue     = null; // left-hand operand
    let shouldResetInput  = false; // true right after an operator is entered

    // ── DOM helpers ──────────────────────────────────────────────────────────
    const expressionEl = document.getElementById('expression');
    const resultEl     = document.getElementById('result');

    function setDisplay(expression, result) {
      expressionEl.textContent = expression;
      resultEl.textContent     = result;
    }

    // ── Core arithmetic ──────────────────────────────────────────────────────
    function calculate(a, op, b) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '×': return a * b;
        case '÷':
          if (b === 0) throw new Error('Cannot divide by zero');
          return a / b;
        default:
          throw new Error('Unknown operator: ' + op);
      }
    }

    // Format a number: remove unnecessary trailing zeros after the decimal
    function formatNumber(n) {
      if (!isFinite(n)) return 'Error';
      // Limit to 10 significant digits to avoid floating-point noise
      return parseFloat(n.toPrecision(10)).toString();
    }

    // ── Button handlers ──────────────────────────────────────────────────────
    function handleDigit(digit) {
      // Prevent multiple decimal points
      if (digit === '.' && currentInput.includes('.')) return;

      if (shouldResetInput) {
        currentInput = digit === '.' ? '0.' : digit;
        shouldResetInput = false;
      } else {
        // Avoid leading zeros (except "0.")
        if (currentInput === '0' && digit !== '.') {
          currentInput = digit;
        } else {
          currentInput += digit;
        }
      }

      const expr = previousValue !== null && operator
        ? formatNumber(previousValue) + ' ' + operator + ' ' + currentInput
        : currentInput;

      setDisplay(expr, currentInput);
    }

    function handleOperator(op) {
      const value = parseFloat(currentInput || '0');

      if (previousValue !== null && operator && !shouldResetInput) {
        // Chain: evaluate the pending operation first
        try {
          const result = calculate(previousValue, operator, value);
          previousValue = result;
          setDisplay(formatNumber(result) + ' ' + op, formatNumber(result));
        } catch (e) {
          setDisplay('', e.message);
          handleClear();
          return;
        }
      } else {
        previousValue = isNaN(value) ? 0 : value;
        setDisplay(formatNumber(previousValue) + ' ' + op, formatNumber(previousValue));
      }

      operator         = op;
      shouldResetInput = true;
    }

    function handleEquals() {
      if (operator === null || previousValue === null) return;

      const value = parseFloat(currentInput || '0');
      const expr  = formatNumber(previousValue) + ' ' + operator + ' ' + formatNumber(value) + ' =';

      try {
        const result = calculate(previousValue, operator, value);
        setDisplay(expr, formatNumber(result));
        // Leave result as the new currentInput so you can chain further
        currentInput     = formatNumber(result);
        previousValue    = null;
        operator         = null;
        shouldResetInput = true;
      } catch (e) {
        setDisplay(expr, e.message);
        currentInput     = '';
        previousValue    = null;
        operator         = null;
        shouldResetInput = true;
      }
    }

    function handleClear() {
      currentInput     = '';
      operator         = null;
      previousValue    = null;
      shouldResetInput = false;
      setDisplay('', '0');
    }
  </script>
</body>
</html>
